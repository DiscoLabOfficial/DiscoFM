name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  check:
    name: Format, Clippy, docs and tests / ${{ matrix.toolchain }}
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: Check Clippy
        run: cargo +${{ matrix.toolchain }} clippy --locked --workspace --all-targets -- -D warnings
      - name: Check API documentation
        run: cargo +${{ matrix.toolchain }} doc --locked --workspace --no-deps
      - name: Run tests
        run: cargo +${{ matrix.toolchain }} test --locked --workspace
